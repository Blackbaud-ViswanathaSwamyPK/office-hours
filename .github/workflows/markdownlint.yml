# Shared source in engineering-governance; edit there and run scripts/sync-governance.ps1.
name: Markdown lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lint all maintained Markdown
        run: npx --yes markdownlint-cli2@0.23.3
